<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stormkeep · Laboratorio editorial</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Germania+One&family=MedievalSharp&display=swap"
    />
    <link rel="stylesheet" href="./editorial/lab.css" />
    <link rel="stylesheet" href="./editorial/inspector.css" />
  </head>
  <body>
    <main>
      <aside class="sidebar" aria-label="Inspector editorial">
        <div class="section">
          <label
            >Componente<select id="component">
              <option value="scene">Escena narrativa</option>
              <option value="intro">Presentación de lugar</option>
            </select></label
          >
          <label
            >Diseño<select id="design">
              <option value="forja">Forja del Ancla</option>
              <option value="plaza">Plaza del Cuervo Gris</option>
            </select></label
          >
          <label
            >Editar propiedades<select id="scope">
              <option value="base">Comunes</option>
              <option value="desktop">Excepciones de escritorio</option>
              <option value="mobile">Excepciones de móvil</option>
            </select></label
          >
          <p class="status" role="status" id="status"></p>
        </div>
        <div id="groups"></div>
        <details>
          <summary>Contenido narrativo</summary>
          <div class="fields">
            <label>Encabezado<input id="kicker" /></label><label>Título<input id="title" /></label
            ><label>Párrafos<textarea id="paragraphs"></textarea></label
            ><label>Ilustración propia<input type="file" accept="image/*" id="upload" /></label
            ><label>Descripción de la imagen<input id="alt" /></label
            ><button id="originalImage">Restaurar imagen original</button>
          </div>
        </details>
        <details>
          <summary>Archivo y bóveda</summary>
          <div class="fields">
            <button id="export">Descargar diseño JSON</button
            ><button id="exportProject">Descargar proyecto con contenido</button
            ><label
              >Importar diseño o proyecto JSON<input
                id="import"
                type="file"
                accept=".json,application/json" /></label
            ><button id="vault">Recargar diseño de la bóveda</button
            ><button id="palette">Tomar paleta de la ilustración</button
            ><button id="png">Descargar recorte PNG</button><button id="svg">Descargar máscara SVG</button
            ><button id="edge">Descargar borde original</button><button id="css">Copiar contorno CSS</button>
            <p class="note">
              La bóveda sirve diseños versionados. Los ajustes y el contenido se guardan en este navegador.
              Exportá una copia para trasladarlos.
            </p>
          </div>
        </details>
      </aside>
      <section class="stage">
        <header>
          <p class="eyebrow">PocketDM / Dirección editorial</p>
          <h1>Laboratorio de composición</h1>
        </header>
        <div class="preview-grid">
          <figure>
            <figcaption>
              Escritorio · 960 px<button aria-label="Escritorio en pantalla completa">⛶</button>
            </figcaption>
            <div class="canvas"></div>
          </figure>
          <figure>
            <figcaption>Móvil · 360 px<button aria-label="Móvil en pantalla completa">⛶</button></figcaption>
            <div class="canvas"></div>
          </figure>
        </div>
      </section>
    </main>
    <script type="module" src="./editorial/lab.mjs"></script>
  </body>
</html>
