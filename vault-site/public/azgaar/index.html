<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PocketDM · Cartografía Azgaar</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c262b;color:#f0e7d3;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid #576365}h1{font:23px Georgia;margin:0}small{color:#b9c3be}nav{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}button,a{font:inherit;color:inherit;background:#304047;border:1px solid #687679;border-radius:5px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover,button[aria-pressed=true]{background:#52605a;border-color:#d2ba83}#view{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#243137}#view:active{cursor:grabbing}#surface{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;pointer-events:none}#map{display:block;width:100%;height:100%;user-select:none}#pin{position:absolute;left:468.14px;top:166.7px;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:3px solid #b75036;background:#ffdf9d99;box-shadow:0 0 0 3px #fff4d5;pointer-events:auto;cursor:pointer}#pin span{position:absolute;left:25px;top:-7px;background:#263239;color:#fff0d6;padding:3px 8px;border-radius:4px;white-space:nowrap;font:bold 13px Georgia}footer{padding:9px 14px;color:#bcc9c5;font-size:12px;display:flex;justify-content:space-between;gap:10px}#state{font-variant-numeric:tabular-nums}#error{position:absolute;inset:0;display:grid;place-items:center;color:#ffd2b2;background:#28343a}#error[hidden]{display:none}@media(max-width:650px){header{padding:10px;gap:7px}h1{font-size:19px}nav{margin:0}button,a{padding:6px 8px;font-size:12px}footer{font-size:10px}}
</style></head><body>
<header><div><h1>Cartografía de Azgaar</h1><small>Exportación original · semilla pocketdm-stormkeep-v1 · no canon</small></div><nav><button id="world">Mundo</button><button id="region">Stormkeep</button><button id="minus" aria-label="Alejar">−</button><button id="plus" aria-label="Acercar">+</button><a href="/atlas/assets/terrain/azgaar-world.png" target="_blank" rel="noopener">PNG original</a><a href="/atlas/?project=azgaar">Editor</a></nav></header>
<div id="view" tabindex="0" aria-label="Mapa original de Azgaar"><div id="surface"><img id="map" src="/atlas/assets/terrain/azgaar-world.png" alt="Mapa físico generado por Azgaar Fantasy Map Generator" draggable="false"><button id="pin" aria-label="Acercar a Stormkeep"><span>Stormkeep</span></button></div><div id="error" hidden>No se pudo cargar la imagen de Azgaar.</div></div>
<footer><span>Azgaar 1.154.1 · 12 estados · 772 asentamientos · 164 ríos</span><span id="state">Cargando…</span></footer>
<script type="module">
const $=id=>document.getElementById(id),v=$('view'),s=$('surface'),im=$('map');let x=0,y=0,z=1,section='world';const points=new Map();let gesture=null;
function draw(){s.style.transform='translate('+x+'px,'+y+'px) scale('+z+')';$('state').textContent=Math.round(z*100)+'% · '+(section==='region'?'Costa de Stormkeep':'Mundo');$('world').setAttribute('aria-pressed',String(section==='world'));$('region').setAttribute('aria-pressed',String(section==='region'))}
function fit(which=section){section=which;const w=which==='region'?480:1600,h=which==='region'?300:1000,cx=which==='region'?468.14:800,cy=which==='region'?166.7:500;z=Math.min(v.clientWidth/w,v.clientHeight/h)*.96;x=v.clientWidth/2-cx*z;y=v.clientHeight/2-cy*z;draw()}
function zoom(f,px=v.clientWidth/2,py=v.clientHeight/2){const n=Math.max(.05,Math.min(12,z*f));x=px-(px-x)*n/z;y=py-(py-y)*n/z;z=n;draw()}
$('world').onclick=()=>fit('world');$('region').onclick=$('pin').onclick=()=>fit('region');$('plus').onclick=()=>zoom(1.35);$('minus').onclick=()=>zoom(1/1.35);
v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(Math.exp(-Math.max(-180,Math.min(180,e.deltaY))*.003),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function point(e){const r=v.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function pair(){const [a,b]=points.values();return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}}
v.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button>0)return;v.setPointerCapture(e.pointerId);points.set(e.pointerId,point(e));gesture=points.size===2?pair():null});
v.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId),q=point(e);points.set(e.pointerId,q);if(points.size===2&&gesture){const n=pair();x+=n.x-gesture.x;y+=n.y-gesture.y;zoom(n.d/Math.max(1,gesture.d),n.x,n.y);gesture=n}else if(points.size===1){x+=q.x-old.x;y+=q.y-old.y;draw()}});
for(const type of ['pointerup','pointercancel'])v.addEventListener(type,e=>{points.delete(e.pointerId);gesture=points.size===2?pair():null});v.addEventListener('keydown',e=>{if(['+','='].includes(e.key))zoom(1.35);if(e.key==='-')zoom(1/1.35)});
new ResizeObserver(()=>fit()).observe(v);im.onerror=()=>$('error').hidden=false;im.onload=()=>{fit();document.body.dataset.ready='true'};if(im.complete&&im.naturalWidth){fit();document.body.dataset.ready='true'}
</script></body></html>
